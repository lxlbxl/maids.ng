<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>Variant A - Service-Focused (1200x628)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 628px;
    background: #0F5556;
    font-family: 'DM Sans', system-ui, sans-serif;
    color: #FAF7F2;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    padding: 0 80px;
    position: relative;
    overflow: hidden;
  }
  .logo {
    width: 160px;
    height: auto;
    margin-right: 40px;
  }
  .content {
    max-width: 600px;
  }
  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 48px;
    font-weight: 400;
    line-height: 1.1;
    margin-bottom: 16px;
  }
  p {
    font-size: 20px;
    line-height: 1.4;
    margin-bottom: 32px;
    opacity: 0.9;
  }
  .cta {
    display: inline-block;
    background: #B45309;
    color: #FAF7F2;
    padding: 14px 40px;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 500;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .utm {
    position: absolute;
    bottom: 20px;
    font-size: 10px;
    opacity: 0.5;
  }

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <img src="../../repo/public/maids-logo-white.png" alt="Maids.ng" class="logo">
  <div class="content">
    <h1>Trusted Domestic Help at Your Doorstep</h1>
    <p>Verified maids, guaranteed satisfaction. Book your perfect match today.</p>
    <a href="https://maids.ng?utm_source=facebook&utm_medium=cpc&utm_campaign=messenger_conversion_test&utm_content=service_focused" class="cta">Book Now</a>
  </div>
  <div class="utm">utm_source=facebook&utm_medium=cpc&utm_campaign=messenger_conversion_test&utm_content=service_focused</div>

</html>
